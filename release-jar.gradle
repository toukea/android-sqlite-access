// ./gradlew clean build generateRelease
apply plugin: 'maven-publish'

def groupId = project.PUBLISH_GROUP_ID
def artifactId = project.PUBLISH_ARTIFACT_ID
def version = project.PUBLISH_VERSION

def localReleaseDest = "${buildDir}/release/${version}"

androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    def name = variant.name
    if (!name.equals("debug")) {
        def jarTask = tasks.register("jar${name.capitalize()}", Jar) {
            def javaCompile = tasks.named("compile${name.capitalize()}JavaWithJavac", JavaCompile)
            from(javaCompile.flatMap { it.destinationDirectory })
        }
        project.artifacts.add('archives', jarTask)
    }
}

